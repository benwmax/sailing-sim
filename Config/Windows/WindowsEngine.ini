; Windows-only engine settings, layered over Config/DefaultEngine.ini.
[/Script/WindowsTargetPlatform.WindowsTargetSettings]
; Build-fast: no DX11 shaders. DefaultEngine.ini takes SM5 out of the DX12 list (the game is DX12 / SM6 only), but
; BaseEngine.ini's D3D11 list still put a whole SM5 shader set in every cook (about 6,000 shaders nobody can load).
-D3D11TargetedShaderFormats=PCD3D_SM5

[SystemSettings]
; Graphics G3: the Mac turns the hair voxelization off (cards only there); Windows draws strands on High and Ultra and
; keeps it, so strands shadow and light each other. Set here explicitly so the PC never inherits the Mac's choice.
r.HairStrands.Voxelization=1
