; Windows-only engine settings, layered over Config/DefaultEngine.ini.
[/Script/WindowsTargetPlatform.WindowsTargetSettings]
; Build-fast: no DX11 shaders. DefaultEngine.ini takes SM5 out of the DX12 list (the game is DX12 / SM6 only), but
; BaseEngine.ini's D3D11 list still put a whole SM5 shader set in every cook (about 6,000 shaders nobody can load).
-D3D11TargetedShaderFormats=PCD3D_SM5

[SystemSettings]
; Graphics G3: the Mac turns the hair voxelization off (cards only there); Windows draws strands on High and Ultra and
; keeps it, so strands shadow and light each other. Set here explicitly so the PC never inherits the Mac's choice.
r.HairStrands.Voxelization=1
; Memory climb (docs: plan "Huge maps without memory growth"): UE 5.8.3's Async upload-heap pools leak. An upload of
; 32-64 MB never fits a 32 MB spare pool, so each one queues another spare; spares are never trimmed, only used up by a
; later smaller overflow (RHIPoolAllocator.cpp TryAllocateInternal; CleanUpAllocations trims Pools[] only). Galveston's
; tide steps upload over 32 MB of instance data, so the PC grew about 233 MB a minute. Immediate (the engine's default on
; unified-memory platforms) makes a pool only when one is needed and trims it when empty: flat on the PC.
d3d12.UploadHeap.PoolAllocationStrategy=0

[/Script/Engine.UserInterfaceSettings]
; docs/dpi-aware: per-monitor DPI aware, or a 150%-scaled 4K desktop gives the game a 2560x1440 screen that Windows stretches (Windows only: on the Mac this key turns on Retina).
bAllowHighDPIInGameMode=True
