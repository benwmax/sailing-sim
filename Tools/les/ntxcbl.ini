# Water W6 LES pilot: a North Texas summer afternoon convective boundary layer over a periodic 10 x 10 x 3 km tile at
# 25 m (MicroHH, CUDA). Surface heat flux 250 W/m2, a 1.5 km mixed layer growing toward 2 km, 13 kn geostrophic wind
# from the south. 2 h spin-up, then the last hour saved (near-surface cross-sections every 60 s, profiles every 5 min).
# Profiles and forcing: ntxcbl_input.py. Run: Tools/les/run_pilot.sh.
[master]
npx=1
npy=1

[grid]
itot=400
jtot=400
ktot=120

xsize=10000.
ysize=10000.
zsize=3000.

swspatialorder=2

[advec]
swadvec=2
cflmax=1.2

[diff]
swdiff=smag2
dnmax=0.3

[thermo]
swthermo=dry
swbasestate=boussinesq
thref0=306.
pbot=97500.

[force]
swlspres=geo
fc=7.9e-5
swls=0
swwls=0

[boundary]
mbcbot=noslip
mbctop=freeslip
sbcbot=flux
sbctop=neumann
# 250 W/m2 / (rho 1.14 kg/m3 * cp 1004 J/kg/K)
sbot=0.218
stop=0.004
swboundary=surface
z0m=0.05
z0h=0.005

[fields]
visc=1.e-5
svisc=1.e-5

rndseed=7
rndamp[th]=0.1
rndz=400.
rndexp=2.

[buffer]
swbuffer=1
zstart=2400.
sigma=0.00223
beta=2.

[time]
endtime=10800
dt=2.
dtmax=20.
savetime=3600
outputiter=100
adaptivestep=true
starttime=0
rkorder=3

[stats]
swstats=1
sampletime=300

[cross]
swcross=1
crosslist=u,v,w,th
sampletime=60
xy=12.5,62.5,212.5
