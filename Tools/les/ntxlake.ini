# Water W6 LES follow-up: the pilot's afternoon (ntxcbl.ini) over Lake Ray Hubbard's own outline. A 10 x 10 km window
# of the game's height grid round Rush Creek (Content/TerrainData/RayHubbard.height) sets the surface: the lake has no
# sensible heat flux and water's roughness, the land 250 W/m2 and 0.05 m. Maps: ntxlake_input.py. Run: run_pilot.sh ntxlake.
[master]
npx=1
npy=1

[grid]
itot=400
jtot=400
ktot=120

xsize=10000.
ysize=10000.
zsize=3000.

swspatialorder=2

[advec]
swadvec=2
cflmax=1.2

[diff]
swdiff=smag2
dnmax=0.3

[thermo]
swthermo=dry
swbasestate=boussinesq
thref0=306.
pbot=97500.

[force]
swlspres=geo
fc=7.9e-5
swls=0
swwls=0

[boundary]
mbcbot=noslip
mbctop=freeslip
sbcbot=flux
sbctop=neumann
# 250 W/m2 / (rho 1.14 kg/m3 * cp 1004 J/kg/K)
sbot=0.218
stop=0.004
swboundary=surface
# Surface maps per cell (ntxlake_input.py): z0m/z0h files, th_bot_in fluxes (constant in time).
swconstantz0=false
swtimedep_sbot_2d=true
sbot_2d_list=th
sbot_2d_loadtime=3600

[fields]
visc=1.e-5
svisc=1.e-5

rndseed=7
rndamp[th]=0.1
rndz=400.
rndexp=2.

[buffer]
swbuffer=1
zstart=2400.
sigma=0.00223
beta=2.

[time]
endtime=10800
dt=2.
dtmax=20.
savetime=3600
outputiter=100
adaptivestep=true
starttime=0
rkorder=3

[stats]
swstats=1
sampletime=300

[cross]
swcross=1
crosslist=u,v,w,th,z0m
sampletime=60
xy=12.5,62.5,212.5
